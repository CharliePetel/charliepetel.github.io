<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exhibitions – Charlie Petel</title>
    <link rel="icon" type="image/png" href="images/favicon.png" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: Helvetica, Arial, sans-serif;
        background: #fff;
        color: #000;
      }

      header {
        padding: 2rem 2rem 1rem;
      }

      .header-inner {
        max-width: 900px;
        margin: 0 auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
      }

      .logo a {
        text-decoration: none;
        color: black;
        font-weight: bold;
        font-size: 1.3rem;
        white-space: nowrap;
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 1.5rem;
        justify-content: flex-end;
      }

      nav a {
        position: relative;
        text-decoration: none;
        color: #000;
        font-size: 0.9rem;
        text-transform: uppercase;
        padding: 0.5rem 0;
      }

      nav a::before,
      nav a::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        height: 1px;
        background: #000;
        transform: scaleX(0);
        transition: transform 0.3s ease;
      }

      nav a::before {
        top: 0; /* obere Linie */
      }

      nav a::after {
        bottom: 0; /* untere Linie */
      }

      nav a:hover::before,
      nav a:hover::after,
      nav a.active::before,
      nav a.active::after {
        transform: scaleX(1); /* Linien sichtbar machen */
      }

      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 2rem;
        max-width: 1000px;
        margin: 3rem auto;
      }
      .tile {
        text-align: center;
        text-decoration: none;
      }
      .tile img {
        width: 282px;
        height: 158px;
        transition: transform 0.3s ease;
      }
      .tile:hover img {
        transform: scale(1.02);
      }
      .tile-title {
        margin-top: 0.75rem;
        font-size: 11px;
        font-weight: bold;
        color: black;
      }
      
      footer {
        padding: 2rem;
        text-align: center;
        font-size: 0.9rem;
        border-top: 1px solid #ccc;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="header-inner">
        <div class="logo"><a href="index.html">Charlie Petel</a></div>
        <nav>
          <a href="index.html">ARTISTS</a>
          <a href="about.html">ABOUT</a>
          <a href="exhibitions.html" class="active">EXHIBITIONS</a>
          <a href="contact.html">CONTACT</a>
        </nav>
      </div>
    </header>

    <section class="gallery">
      <a class="tile" href="exhibitions/HowManyMoreTimes.html">
        <img src="images/HowManyMoreTimes.jpg" alt="Lulu Chiadmi - How many more times" />
        <div class="tile-title">Lulu Chiadmi - How many more times</div>
      </a>

    </section>

    <footer>© 2026 Charlie Petel. All rights reserved.</footer>
  </body>
</html>
